name: CI to GHCR

on:
  push:
    branches-ignore:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]

# Don't keep building commits that have already been superseded. Tags are
# excluded: every release tag must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    # arm64 runner (free for public repos). The only target platform is
    # linux/arm64, so this builds natively -- no QEMU emulation anywhere in the
    # job, which is where nearly all of the old build time went.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branch event
            type=ref,event=branch
            # Tag event
            type=ref,event=tag
            # Always create sha image tag
            type=sha
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      -
        name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          # arm64 only: that covers Raspberry Pi 3/4/5 running a 64-bit OS.
          # Dropped amd64 (unused), arm/v6 (python:*-slim has no arm/v6 variant,
          # so it only ever resolved to the arm/v5 base) and arm/v7 (no 32-bit
          # targets). Re-adding any of them reintroduces QEMU emulation, so put
          # back the docker/setup-qemu-action step if you do.
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
